<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Dalam Pembangunan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4', 900: '#164e63' }
                    },
                    animation: {
                        'spin-slow': 'spin 5s linear infinite',
                        'spin-reverse': 'spin 7s linear infinite reverse',
                        'pulse-fast': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { overflow: hidden; }
        
        /* Background Grid Animasi (Pola Blueprint) */
        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            animation: moveGrid 20s linear infinite;
        }
        @keyframes moveGrid {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Custom Scrollbar untuk Terminal */
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen flex items-center justify-center font-mono selection:bg-cyan-500 selection:text-slate-900 relative">

    <!-- Latar Belakang Blueprint Grid & Overlay Cahaya -->
    <div class="absolute inset-0 grid-bg pointer-events-none -mt-10 h-[120%] z-0"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-900/10 rounded-full blur-[100px] pointer-events-none z-0"></div>

    <main class="relative z-10 w-full max-w-4xl px-6 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        
        <!-- Bagian Kiri: Animasi Modul Perakitan -->
        <div class="flex flex-col items-center md:items-end justify-center">
            <div class="relative w-56 h-56 flex items-center justify-center animate-float">
                <!-- Cincin Kompilasi Luar -->
                <svg class="absolute inset-0 w-full h-full text-cyan-500/30 animate-spin-slow" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="15 10 30 10" />
                </svg>
                
                <!-- Cincin Geometris Tengah -->
                <svg class="absolute w-40 h-40 text-cyan-400/50 animate-spin-reverse" viewBox="0 0 100 100">
                    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="currentColor" stroke-width="1" />
                    <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4 4" />
                </svg>

                <!-- Core Block Inti (Menggambarkan Code/Build) -->
                <div class="absolute bg-slate-900 border border-cyan-400/60 w-16 h-16 flex items-center justify-center shadow-[0_0_25px_rgba(6,182,212,0.4)] animate-pulse-fast">
                    <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Bagian Kanan: Teks & Build Logs -->
        <div class="flex flex-col text-center md:text-left">
            <div class="inline-block px-3 py-1 mb-4 border border-cyan-500/40 bg-cyan-500/10 text-cyan-400 text-xs tracking-widest uppercase rounded self-center md:self-start shadow-[0_0_10px_rgba(34,211,238,0.1)]">
                Status: Tahap Pembangunan (Build)
            </div>
            
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 tracking-wider uppercase">
                Under <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Construction</span>
            </h1>
            
            <p class="text-slate-400 text-sm mb-6 leading-relaxed max-w-md">
                Infrastruktur sedang dirakit dan dikompilasi. Kami sedang men-deploy komponen inti dan membangun antarmuka untuk pengalaman yang optimal.
            </p>

            <!-- Terminal Build Log -->
            <div class="bg-black/60 border border-slate-800 rounded-lg p-4 w-full max-w-md h-40 overflow-hidden relative shadow-2xl backdrop-blur-sm">
                <div class="absolute top-0 left-0 w-full h-4 bg-gradient-to-b from-black/90 to-transparent z-10"></div>
                <div id="log-container" class="terminal-scroll h-full overflow-y-auto text-xs text-slate-500 space-y-1.5 pb-4 font-mono">
                    <!-- Log akan diisi oleh JavaScript -->
                </div>
                <div class="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-black/95 to-transparent z-10"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="absolute bottom-6 w-full text-center text-xs text-slate-600 tracking-[0.2em]">
        SYS.ADM: YORYZIAR // <span id="build-time" class="text-cyan-500/60"></span>
    </footer>

    <!-- Script Animasi Terminal Log & Uptime -->
    <script>
        // Simulasi Log Proses Build/Deployment
        const logMessages = [
            "[SYSTEM] Memulai protokol perakitan (build mode)...",
            "[DOCKER] Menginisialisasi container environment... OK",
            "[SERVER] Mengonfigurasi zRAM dan optimasi Swap... AMAN",
            "[CORE] Menyiapkan arsitektur Next.js & Tailwind...",
            "[DATABASE] Menjalankan migrasi skema awal... OK",
            "[MODULE] Mengompilasi komponen antarmuka pengguna...",
            "[NETWORK] Membuka port dan menyiapkan routing...",
            "[SECURITY] Mengonfigurasi variabel lingkungan... AMAN",
            "[STATUS] Menunggu penyelesaian perakitan komponen...",
            "[SYSTEM] Infrastruktur sedang dibangun..."
        ];

        const logContainer = document.getElementById('log-container');
        let logIndex = 0;

        function addLog() {
            if (logIndex < logMessages.length) {
                const p = document.createElement('p');
                
                // Beri warna cyan pada kata "OK" atau "AMAN"
                let text = logMessages[logIndex];
                text = text.replace(/(OK|AMAN)/g, '<span class="text-cyan-400 font-bold">$1</span>');
                text = text.replace(/(\[.*?\])/g, '<span class="text-slate-400">$1</span>');
                
                p.innerHTML = `> ${text}`;
                p.style.opacity = '0';
                p.style.transform = 'translateY(10px)';
                p.style.transition = 'all 0.3s ease';
                
                logContainer.appendChild(p);
                
                setTimeout(() => {
                    p.style.opacity = '1';
                    p.style.transform = 'translateY(0)';
                    logContainer.scrollTop = logContainer.scrollHeight;
                }, 50);

                logIndex++;
                
                const delay = logIndex > 8 ? 1800 : 400 + Math.random() * 700;
                setTimeout(addLog, delay);
            } else {
                const cursor = document.createElement('p');
                cursor.innerHTML = `> <span class="animate-pulse text-cyan-500 font-bold">_</span>`;
                logContainer.appendChild(cursor);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        // Script Penghitung Waktu Build
        let seconds = 0;
        function updateTimer() {
            seconds++;
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('build-time').textContent = `BUILD TIME: ${h}:${m}:${s}`;
        }

        // Inisialisasi
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(addLog, 800);
            updateTimer();
            setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>
